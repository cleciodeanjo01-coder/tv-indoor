<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mídia Indoor - Player Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
    
    * { user-select: none; box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }

    .bg-blur-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; filter: blur(25px) brightness(0.4); transform: scale(1.1);
      transition: opacity 0.3s ease-in-out; z-index: 1;
    }

    .media-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; opacity: 0; transition: opacity 0.3s ease-in-out; z-index: 2;
    }
    .media-layer.active { opacity: 1; }

    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 25s linear infinite; }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-black text-white">

  <div id="bg-container" class="absolute inset-0 z-1 overflow-hidden"></div>
  <div id="player-container" class="relative w-full h-full flex items-center justify-center z-2"></div>

  <div class="absolute top-6 left-6 z-30 pointer-events-none">
    <div class="glass-panel px-5 py-3 rounded-2xl flex items-center gap-3 shadow-2xl">
      <div class="w-7 h-7 bg-orange-600 rounded-lg flex items-center justify-center font-black text-xs text-white shadow-md">HTML</div>
      <span id="brand-title" class="font-extrabold text-base tracking-wider text-white">MÍDIA INDOOR</span>
    </div>
  </div>

  <div class="absolute top-6 right-6 z-30 pointer-events-none flex items-center gap-4">
    <div class="glass-panel px-6 py-3 rounded-2xl flex items-center gap-6 shadow-2xl">
      <div class="flex items-center gap-3 pr-4 border-r border-slate-700/60">
        <i class="fa-solid fa-sun text-yellow-400 text-2xl"></i>
        <div class="flex flex-col">
          <span id="weather-temp" class="text-lg font-black leading-none text-white">26°C</span>
          <span class="text-[10px] text-slate-300 font-bold tracking-widest uppercase mt-0.5">VICENTINÓPOLIS</span>
        </div>
      </div>
      <div class="flex flex-col text-right">
        <span id="clock-time" class="text-2xl font-black tracking-widest text-emerald-400 leading-none">00:00:00</span>
        <span id="clock-date" class="text-[10px] text-slate-300 font-medium tracking-wide mt-1">--/--/----</span>
      </div>
    </div>
  </div>

  <div id="qr-box" class="absolute bottom-16 right-6 z-40 glass-panel p-4 rounded-3xl shadow-2xl flex flex-col items-center gap-2 border border-emerald-500/20 max-w-[180px]">
    <div id="qrcode" class="bg-white p-2 rounded-2xl shadow-inner"></div>
    <span id="qr-label" class="text-xs font-black uppercase tracking-wider text-white text-center mt-1">ACESSE NOSSO SITE</span>
    <span class="text-[9px] text-slate-300 text-center leading-tight">Aponte a câmera do seu celular</span>
  </div>

  <div class="absolute bottom-0 left-0 w-full z-30 glass-panel border-t border-slate-800 py-2.5 overflow-hidden">
    <div class="flex items-center">
      <div class="bg-emerald-500 text-slate-950 font-black text-xs px-4 py-1 rounded-r-full uppercase tracking-wider z-10 shrink-0 shadow-lg flex items-center gap-2 ml-4">
        <i class="fa-solid fa-bullhorn"></i>
        <span>AVISOS</span>
      </div>
      <div class="overflow-hidden w-full relative flex items-center">
        <div id="ticker-text" class="animate-marquee font-bold text-sm tracking-wide text-slate-100 pl-8">
          Seja bem-vindo! Acompanhe nossas novidades e ofertas na tela.
        </div>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "cleciodeanjo01-coder";
    const GITHUB_REPO = "tv-indoor"; 
    const JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/playlist.json`;

    let playlist = [];
    let currentIndex = 0;
    let timer = null;
    let imageDuration = 10;
    let lastJsonRaw = "";
    let currentQrLink = "";

    function setupClock() {
      function update() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById("clock-time").innerText = `${hours}:${minutes}:${seconds}`;

        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        document.getElementById("clock-date").innerText = `${day}/${month}/${year}`;
      }
      setInterval(update, 1000);
      update();
    }

    async function fetchPlaylist() {
      try {
        const cacheBuster = `${new Date().getTime()}_${Math.random()}`;
        const response = await fetch(`${JSON_URL}?t=${cacheBuster}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });
        
        if (!response.ok) return;

        const textData = await response.text();
        if (textData === lastJsonRaw) return; 

        lastJsonRaw = textData;
        const data = JSON.parse(textData);

        if (data.brand) document.getElementById("brand-title").innerText = data.brand;
        if (data.ticker) document.getElementById("ticker-text").innerText = data.ticker;
        if (data.duration) imageDuration = parseInt(data.duration) || 10;

        if (data.urls && Array.isArray(data.urls) && data.urls.length > 0) {
          playlist = data.urls.map(item => {
            const mediaUrl = typeof item === "string" ? item : item.url;
            const isVideo = mediaUrl.endsWith(".mp4") || mediaUrl.endsWith(".webm") || mediaUrl.includes("video");
            
            return {
              type: isVideo ? "video" : "image",
              url: mediaUrl,
              qrLink: (typeof item === "object" && item.qrLink) ? item.qrLink : (data.qrLink || ""),
              qrTitle: (typeof item === "object" && item.qrTitle) ? item.qrTitle : (data.qrTitle || "ACESSE NOSSO SITE")
            };
          });

          if (!timer) {
            currentIndex = 0;
            playNextMedia();
          }
        }
      } catch (err) {
        console.error("Erro ao carregar a playlist central:", err);
      }
    }

    function playNextMedia() {
      if (playlist.length === 0) return;

      const container = document.getElementById("player-container");
      const bgContainer = document.getElementById("bg-container");
      const currentItem = playlist[currentIndex];
      
      const qrBox = document.getElementById("qr-box");
      if (currentItem.qrLink && currentItem.qrLink.trim() !== "") {
        qrBox.classList.remove("hidden");
        document.getElementById("qr-label").innerText = currentItem.qrTitle;
        
        if (currentQrLink !== currentItem.qrLink) {
          currentQrLink = currentItem.qrLink;
          document.getElementById("qrcode").innerHTML = "";
          new QRCode(document.getElementById("qrcode"), {
            text: currentQrLink,
            width: 110,
            height: 110,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      } else {
        qrBox.classList.add("hidden");
      }
      
      const oldMedia = container.querySelectorAll('.media-layer');
      const oldBg = bgContainer.querySelectorAll('.bg-blur-layer');

      if (currentItem.type === "image") {
        const bgImg = document.createElement("img");
        bgImg.src = currentItem.url;
        bgImg.className = "bg-blur-layer";
        bgContainer.appendChild(bgImg);

        const img = document.createElement("img");
        img.src = currentItem.url;
        img.className = "media-layer";
        container.appendChild(img);

        setTimeout(() => {
          img.classList.add("active");
          oldMedia.forEach(el => el.remove());
          oldBg.forEach(el => el.remove());
        }, 10);

        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        }, imageDuration * 1000);

      } else if (currentItem.type === "video") {
        const video = document.createElement("video");
        video.src = currentItem.url;
        video.className = "media-layer";
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;

        video.onloadeddata = () => {
          video.classList.add("active");
          oldMedia.forEach(el => el.remove());
          oldBg.forEach(el => el.remove());
        };

        video.onended = () => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        };

        video.onerror = () => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        };

        container.appendChild(video);
        video.play().catch(() => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        });
      }
    }

    setupClock();
    fetchPlaylist();
    setInterval(fetchPlaylist, 5000);
  </script>
</body>
</html>
