<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mídia Indoor com QR Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Biblioteca para gerar o QR Code automaticamente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
    * { user-select: none; box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }

    .media-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; opacity: 0; transition: opacity 1s ease-in-out; z-index: 1;
    }
    .media-layer.active { opacity: 1; z-index: 2; }

    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 25s linear infinite; }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-black text-white">

  <!-- CONTAINER DE MÍDIAS -->
  <div id="player-container" class="relative w-full h-full flex items-center justify-center bg-black"></div>

  <!-- CABEÇALHO SUPERIOR -->
  <div class="absolute top-6 left-6 right-6 z-30 flex justify-between items-start pointer-events-none">
    <div id="brand-container" class="glass-panel px-5 py-3 rounded-2xl flex items-center gap-3 shadow-2xl">
      <span id="brand-title" class="font-extrabold text-lg tracking-wider text-white">MÍDIA INDOOR</span>
    </div>

    <div class="glass-panel px-6 py-3 rounded-2xl flex items-center gap-6 shadow-2xl">
      <div class="flex flex-col text-right">
        <span id="clock-time" class="text-2xl font-black tracking-widest text-emerald-400 leading-none">00:00:00</span>
        <span id="clock-date" class="text-xs text-slate-300 font-medium tracking-wide mt-1">--/--/----</span>
      </div>
    </div>
  </div>

  <!-- WIDGET DO QR CODE FLUTUANTE (CANTO INFERIOR DIREITO) -->
  <div id="qr-box" class="absolute bottom-16 right-6 z-40 glass-panel p-4 rounded-3xl shadow-2xl flex flex-col items-center gap-2 hidden border border-emerald-500/30">
    <span id="qr-label" class="text-xs font-black uppercase tracking-wider text-emerald-400">Escaneie aqui</span>
    <div id="qrcode" class="bg-white p-2 rounded-2xl shadow-inner"></div>
  </div>

  <!-- RODAPÉ LETREIRO -->
  <div class="absolute bottom-0 left-0 w-full z-30 glass-panel border-t border-slate-800 py-3 overflow-hidden">
    <div class="flex items-center">
      <div class="bg-emerald-500 text-slate-950 font-black text-xs px-4 py-1 rounded-r-full uppercase tracking-wider z-10 shrink-0 shadow-lg flex items-center gap-2 ml-4">
        <i class="fa-solid fa-bullhorn animate-pulse"></i>
        <span>Avisos</span>
      </div>
      <div class="overflow-hidden w-full relative flex items-center">
        <div id="ticker-text" class="animate-marquee font-bold text-sm tracking-wide text-slate-100 pl-8">
          Carregando programação...
        </div>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "cleciodeanjo01-coder";
    const GITHUB_REPO = "tv-indoor"; 
    const JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/playlist.json`;

    let playlist = [];
    let currentIndex = 0;
    let timer = null;
    let imageDuration = 10;
    let lastJsonRaw = "";
    let currentQrLink = "";

    function setupClock() {
      function update() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById("clock-time").innerText = `${hours}:${minutes}:${seconds}`;

        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        document.getElementById("clock-date").innerText = `${day}/${month}/${year}`;
      }
      setInterval(update, 1000);
      update();
    }

    async function fetchPlaylist() {
      try {
        const response = await fetch(`${JSON_URL}?t=${new Date().getTime()}`);
        if (!response.ok) return;

        const textData = await response.text();
        if (textData === lastJsonRaw) return; 

        lastJsonRaw = textData;
        const data = JSON.parse(textData);

        if (data.brand) document.getElementById("brand-title").innerText = data.brand;
        if (data.ticker) document.getElementById("ticker-text").innerText = data.ticker;
        if (data.duration) imageDuration = parseInt(data.duration) || 10;

        // Gerenciamento do QR Code na tela
        const qrBox = document.getElementById("qr-box");
        if (data.qrLink && data.qrLink.trim() !== "") {
          qrBox.classList.remove("hidden");
          if (data.qrTitle) {
            document.getElementById("qr-label").innerText = data.qrTitle;
          }
          if (currentQrLink !== data.qrLink) {
            currentQrLink = data.qrLink;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
              text: currentQrLink,
              width: 120,
              height: 120,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.H
            });
          }
        } else {
          qrBox.classList.add("hidden");
          currentQrLink = "";
        }

        if (data.urls && Array.isArray(data.urls) && data.urls.length > 0) {
          playlist = data.urls.map(url => {
            const isVideo = url.endsWith(".mp4") || url.endsWith(".webm") || url.includes("video");
            return { type: isVideo ? "video" : "image", url: url };
          });

          if (!timer) {
            currentIndex = 0;
            playNextMedia();
          }
        }
      } catch (err) {
        console.error("Erro ao buscar playlist central do GitHub:", err);
      }
    }

    function playNextMedia() {
      if (playlist.length === 0) return;

      const container = document.getElementById("player-container");
      const currentItem = playlist[currentIndex];
      const oldElements = container.querySelectorAll('.media-layer');

      if (currentItem.type === "image") {
        const img = document.createElement("img");
        img.src = currentItem.url;
        img.className = "media-layer";
        container.appendChild(img);

        setTimeout(() => {
          img.classList.add("active");
          oldElements.forEach(el => el.remove());
        }, 50);

        timer = setTimeout(() => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        }, imageDuration * 1000);

      } else if (currentItem.type === "video") {
        const video = document.createElement("video");
        video.src = currentItem.url;
        video.className = "media-layer";
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;

        video.onloadeddata = () => {
          video.classList.add("active");
          oldElements.forEach(el => el.remove());
        };

        video.onended = () => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        };

        video.onerror = () => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        };

        container.appendChild(video);
        video.play().catch(() => {
          currentIndex = (currentIndex + 1) % playlist.length;
          playNextMedia();
        });
      }
    }

    setupClock();
    fetchPlaylist();
    setInterval(fetchPlaylist, 20000);
  </script>
</body>
</html>
